<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NORDWIND // GRAPH NAVIGATOR</title>
<style>
  html, body { margin: 0; height: 100%; background: #000005; overflow: hidden;
               font-family: "Courier New", ui-monospace, monospace; }
  #graph { width: 100vw; height: 100vh; }
  .hud { position: absolute; z-index: 10; color: #7dd3fc;
         text-shadow: 0 0 8px rgba(56,189,248,.8); }
  #title { top: 22px; left: 26px; pointer-events: none; }
  #title h1 { margin: 0; font-size: 20px; letter-spacing: 6px; color: #e0f2fe; }
  #title p  { margin: 4px 0 0 0; font-size: 11px; letter-spacing: 3px; opacity: .75; }
  #legend { bottom: 96px; left: 26px; font-size: 11px; letter-spacing: 2px; line-height: 1.9; pointer-events: none; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px;
         box-shadow: 0 0 8px currentColor; }
  #controls { position: absolute; top: 22px; right: 26px; z-index: 20; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 560px; }
  .btn { font-family: inherit; font-size: 11px; letter-spacing: 2px; padding: 8px 12px; cursor: pointer;
         color: #7dd3fc; background: rgba(8,20,35,.65); border: 1px solid rgba(56,189,248,.5);
         border-radius: 3px; text-shadow: 0 0 6px rgba(56,189,248,.9);
         box-shadow: 0 0 12px rgba(56,189,248,.25), inset 0 0 12px rgba(56,189,248,.08); }
  .btn:hover { background: rgba(14,40,66,.85); }
  .btn.active { color: #fde68a; border-color: rgba(251,191,36,.8);
                text-shadow: 0 0 8px rgba(251,191,36,1);
                box-shadow: 0 0 16px rgba(251,191,36,.4), inset 0 0 12px rgba(251,191,36,.1); }
  #scan { position: absolute; inset: 0; z-index: 5; pointer-events: none; mix-blend-mode: overlay; opacity: .16;
          background: repeating-linear-gradient(0deg, rgba(120,200,255,.25) 0 1px, transparent 1px 4px); }
  /* uplink panel */
  #uplink { position: absolute; z-index: 40; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: rgba(3,12,24,.92); border: 1px solid rgba(56,189,248,.6); border-radius: 6px;
            padding: 26px 30px; width: 420px; box-shadow: 0 0 40px rgba(56,189,248,.25); color: #bae6fd; }
  #uplink h2 { margin: 0 0 4px 0; font-size: 15px; letter-spacing: 4px; color: #e0f2fe; }
  #uplink p  { margin: 0 0 16px 0; font-size: 10px; letter-spacing: 2px; opacity: .7; }
  #uplink label { display: block; font-size: 10px; letter-spacing: 2px; margin: 10px 0 4px; opacity: .8; }
  #uplink input { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 12px;
                  background: rgba(2,8,16,.9); color: #e0f2fe; border: 1px solid rgba(56,189,248,.4);
                  border-radius: 3px; padding: 8px 10px; outline: none; }
  #uplink input:focus { border-color: #7dd3fc; box-shadow: 0 0 10px rgba(56,189,248,.4); }
  #uplink .row { display: flex; gap: 10px; margin-top: 18px; }
  #uplink .row .btn { flex: 1; text-align: center; }
  #upmsg { margin-top: 12px; font-size: 10px; letter-spacing: 1px; min-height: 14px; color: #fca5a5; }
  /* console + log */
  #consoleWrap { position: absolute; z-index: 30; bottom: 20px; left: 50%; transform: translateX(-50%);
                 width: min(860px, 92vw); }
  #log { font-size: 10.5px; letter-spacing: 1px; line-height: 1.7; margin-bottom: 8px;
         color: #86efac; text-shadow: 0 0 6px rgba(134,239,172,.6); max-height: 96px; overflow: hidden; }
  #log .err { color: #fca5a5; text-shadow: 0 0 6px rgba(252,165,165,.6); }
  #log .sys { color: #7dd3fc; }
  #cypherbox { display: flex; gap: 8px; }
  #cypher { flex: 1; font-family: inherit; font-size: 12.5px; background: rgba(3,12,24,.85);
            color: #e0f2fe; border: 1px solid rgba(56,189,248,.5); border-radius: 3px;
            padding: 11px 14px; outline: none; box-shadow: 0 0 16px rgba(56,189,248,.15); }
  #cypher:focus { border-color: #7dd3fc; box-shadow: 0 0 18px rgba(56,189,248,.35); }
  #cypher::placeholder { color: #38566e; }
  #hint2 { position: absolute; bottom: 96px; right: 26px; font-size: 10px; letter-spacing: 2px;
           opacity: .55; text-align: right; pointer-events: none; }
</style>
</head>
<body>
<div id="graph"></div>
<div id="scan"></div>

<div class="hud" id="title">
  <h1>NORDWIND ⟁ GRAPH NAVIGATOR</h1>
  <p id="status">UPLINK: OFFLINE</p>
</div>

<div class="hud" id="legend">
  <span class="dot" style="color:#ffb020; background:#ffb020"></span>TEAM&nbsp;&nbsp;
  <span class="dot" style="color:#00d4ff; background:#00d4ff"></span>ENGINEER&nbsp;&nbsp;
  <span class="dot" style="color:#00ff9d; background:#00ff9d"></span>SERVICE&nbsp;&nbsp;
  <span class="dot" style="color:#ff2d55; background:#ff2d55"></span>INCIDENT
</div>
<div class="hud" id="hint2">CLICK NODE = EXPAND FROM DB · DRAG ROTATE · SCROLL ZOOM</div>

<div id="controls">
  <button class="btn" id="uplinkBtn">🔌 UPLINK</button>
  <button class="btn" id="loadAllBtn">⬇ LOAD ALL</button>
  <button class="btn" id="traceBtn">⚡ TRACE IMPACT</button>
  <button class="btn" id="clearHlBtn">◌ CLEAR TRACE</button>
  <button class="btn" id="resetBtn">⟲ RESET</button>
  <button class="btn" id="orbitBtn">◉ ORBIT</button>
  <button class="btn" id="snapBtn">📼 SNAPSHOT MODE</button>
</div>

<div id="uplink">
  <h2>⟁ ESTABLISH UPLINK</h2>
  <p>CONNECT TO A LIVE NEO4J INSTANCE — EVERY NODE YOU SEE WILL COME FROM CYPHER</p>
  <label>BOLT URI</label>
  <input id="uri" placeholder="neo4j+s://xxxxxxxx.databases.neo4j.io" spellcheck="false">
  <label>PASSWORD (user: neo4j)</label>
  <input id="pw" type="password" spellcheck="false">
  <div class="row">
    <button class="btn" id="connectBtn">CONNECT</button>
    <button class="btn" id="offlineBtn">NO DB — SNAPSHOT MODE</button>
  </div>
  <div id="upmsg"></div>
</div>

<div class="hud" id="consoleWrap">
  <div id="log"></div>
  <div id="cypherbox">
    <input id="cypher" placeholder="MATCH (n:Service)-[r:DEPENDS_ON]->(m) RETURN n,r,m   — type Cypher, press Enter" spellcheck="false" disabled>
  </div>
</div>

<script src="https://unpkg.com/neo4j-driver@5.28.1/lib/browser/neo4j-web.min.js"></script>
<script type="importmap">{ "imports": {
  "three": "https://esm.sh/three@0.180.0",
  "three/webgpu": "https://esm.sh/three@0.180.0/webgpu",
  "three/tsl": "https://esm.sh/three@0.180.0/tsl",
  "three/addons/": "https://esm.sh/three@0.180.0/examples/jsm/",
  "three/examples/jsm/": "https://esm.sh/three@0.180.0/examples/jsm/"
} }</script>
<script type="module">
import ForceGraph3D from 'https://esm.sh/3d-force-graph@1.77.0?external=three';
import * as THREE from 'three';
import { UnrealBloomPass } from 'https://esm.sh/three@0.180.0/examples/jsm/postprocessing/UnrealBloomPass.js?external=three';

/* ---------- state ---------- */
const COLORS = { Team:'#ffb020', Engineer:'#00d4ff', Service:'#00ff9d', Incident:'#ff2d55' };
const LINK_COLORS = { MEMBER_OF:'#2a4a66', OWNS:'#5e4a15', DEPENDS_ON:'#0e7a55',
                      AFFECTED:'#7a1e30', RESPONDED_TO:'#1e4a7a' };
const nodesById = new Map(), linksById = new Map();
const gData = { nodes: [], links: [] };
const hl = { nodes: new Set(), links: new Set(), on: false };
let driver = null, dbSession = null, snapshotMode = false;

const $ = id => document.getElementById(id);
const setStatus = t => $('status').textContent = t;
function log(msg, cls='') {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = msg;
  $('log').appendChild(div);
  while ($('log').children.length > 5) $('log').removeChild($('log').firstChild);
}

/* ---------- graph ---------- */
const Graph = new ForceGraph3D($('graph'))
  .graphData(gData)
  .backgroundColor('#000005')
  .showNavInfo(false)
  .nodeLabel(n => `<div style="font-family:monospace; background:rgba(2,10,20,.92); border:1px solid ${COLORS[n.group]||'#7dd3fc'};
      padding:7px 10px; border-radius:3px; color:#e2f4ff; box-shadow:0 0 14px ${COLORS[n.group]||'#7dd3fc'}55">
      <b style="color:${COLORS[n.group]||'#7dd3fc'}">${n.name}</b><br>
      <span style="opacity:.75; font-size:11px">${n.sub||n.group}</span><br>
      <span style="opacity:.5; font-size:10px">click = expand neighborhood from DB</span></div>`)
  .nodeColor(n => hl.on ? (hl.nodes.has(n.id) ? COLORS[n.group]||'#7dd3fc' : '#16202c') : (COLORS[n.group]||'#7dd3fc'))
  .nodeVal(n => (hl.on && hl.nodes.has(n.id)) ? n.val*2.1 : n.val)
  .nodeOpacity(0.92)
  .nodeResolution(16)
  .linkColor(l => hl.on ? (hl.links.has(l.id) ? '#ffd54a' : '#0b1220') : (LINK_COLORS[l.type]||'#334155'))
  .linkWidth(l => (hl.on && hl.links.has(l.id)) ? 2.4 : 0.6)
  .linkOpacity(0.55)
  .linkDirectionalParticles(l => hl.on ? (hl.links.has(l.id) ? 5 : 0)
                                       : (l.type==='DEPENDS_ON'||l.type==='AFFECTED' ? 2 : 0))
  .linkDirectionalParticleWidth(l => (hl.on && hl.links.has(l.id)) ? 2.6 : 1.4)
  .linkDirectionalParticleSpeed(0.006)
  .linkDirectionalParticleColor(l => (hl.on && hl.links.has(l.id)) ? '#ffe27a'
                                       : (l.type==='AFFECTED' ? '#ff5d7a' : '#3dffb0'))
  .onNodeClick(async node => {
    const dist = 150, ratio = 1 + dist / (Math.hypot(node.x, node.y, node.z) || 1);
    Graph.cameraPosition({ x: node.x*ratio, y: node.y*ratio, z: node.z*ratio }, node, 1200);
    await expandNode(node);
  });

try {
  const bloom = new UnrealBloomPass();
  bloom.strength = 1.05; bloom.radius = 0.45; bloom.threshold = 0.0;
  Graph.postProcessingComposer().addPass(bloom);
} catch (e) { console.warn('bloom unavailable:', e); }
Graph.scene().add(new THREE.AmbientLight(0xffffff, 2.4));
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(2400 * 3);
for (let i = 0; i < starPos.length; i++) starPos[i] = (Math.random() - 0.5) * 4200;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
Graph.scene().add(new THREE.Points(starGeo,
  new THREE.PointsMaterial({ color:'#5b7fa6', size:1.1, transparent:true, opacity:0.55 })));
Graph.d3Force('charge').strength(-260);
const controls = Graph.controls();
controls.autoRotateSpeed = 0.5;

function refresh() {
  Graph.graphData(gData);
  Graph.nodeColor(Graph.nodeColor()); Graph.nodeVal(Graph.nodeVal());
  Graph.linkColor(Graph.linkColor()); Graph.linkWidth(Graph.linkWidth());
  Graph.linkDirectionalParticles(Graph.linkDirectionalParticles());
}

/* ---------- ingest neo4j records into the scene ---------- */
function subFor(labels, p) {
  const g = labels[0];
  if (g === 'Team') return p.focus || '';
  if (g === 'Engineer') return p.role || '';
  if (g === 'Service') return p.description || '';
  if (g === 'Incident') return `${p.severity||''} · ${p.title||''}`;
  return labels.join(',');
}
function addNode(v) {
  const id = v.elementId;
  if (nodesById.has(id)) return nodesById.get(id);
  const labels = v.labels, p = v.properties;
  const n = { id, group: labels[0], name: p.name || p.id || p.title || labels[0],
              sub: subFor(labels, p),
              val: labels[0]==='Team'?14 : labels[0]==='Service'?8 : labels[0]==='Incident'?6 : 4 };
  nodesById.set(id, n); gData.nodes.push(n);
  return n;
}
function addRel(v) {
  const id = v.elementId;
  if (linksById.has(id)) return linksById.get(id);
  if (!nodesById.has(v.startNodeElementId) || !nodesById.has(v.endNodeElementId)) return null;
  const l = { id, source: v.startNodeElementId, target: v.endNodeElementId, type: v.type };
  linksById.set(id, l); gData.links.push(l);
  return l;
}
function ingest(records) {
  let nN = 0, nL = 0;
  const touchedN = new Set(), touchedL = new Set();
  const eat = v => {
    if (v == null) return;
    if (v.labels && v.elementId) { const before=nodesById.size; touchedN.add(addNode(v).id); if(nodesById.size>before) nN++; }
    else if (v.type && v.startNodeElementId) { const before=linksById.size; const l=addRel(v); if(l){touchedL.add(l.id); if(linksById.size>before) nL++;} }
    else if (v.segments) {           // Path
      v.segments.forEach(s => { eat(s.start); eat(s.end); eat(s.relationship); });
      if (v.start) eat(v.start);
    }
    else if (Array.isArray(v)) v.forEach(eat);
  };
  // two passes so relationships always find their endpoints
  records.forEach(r => r.keys.forEach(k => { const v = r.get(k);
    if (v && (v.labels || v.segments || Array.isArray(v))) eat(v); }));
  records.forEach(r => r.keys.forEach(k => eat(r.get(k))));
  return { nN, nL, touchedN, touchedL };
}

/* ---------- cypher ---------- */
async function runCypher(q, params={}, highlight=false) {
  if (snapshotMode) { log('SNAPSHOT MODE — no live DB. Reconnect via UPLINK to run Cypher.', 'err'); return; }
  if (!driver) { log('NO UPLINK — connect first.', 'err'); return; }
  const t0 = performance.now();
  try {
    const res = await dbSession.run(q, params);
    const ms = (performance.now()-t0).toFixed(0);
    const { nN, nL, touchedN, touchedL } = ingest(res.records);
    if (highlight) { hl.nodes = touchedN; hl.links = touchedL; hl.on = touchedN.size > 0; }
    refresh();
    const scalars = res.records.length && !nN && !nL && !touchedN.size
      ? ' · ' + JSON.stringify(res.records[0].toObject()).slice(0, 90) : '';
    log(`↳ ${res.records.length} records · +${nN} nodes +${nL} rels · ${ms}ms${scalars}`);
    return res;
  } catch (e) {
    log('✗ ' + (e.message||e).toString().slice(0, 110), 'err');
  }
}

async function expandNode(node) {
  if (snapshotMode || !driver) return;
  log(`> EXPAND ${node.name}`, 'sys');
  await runCypher(
    'MATCH (n) WHERE elementId(n) = $id MATCH (n)-[r]-(m) RETURN n, r, m',
    { id: node.id });
}

/* ---------- uplink ---------- */
$('connectBtn').onclick = async () => {
  const uri = $('uri').value.trim(), pw = $('pw').value;
  $('upmsg').textContent = 'HANDSHAKING…'; $('upmsg').style.color = '#7dd3fc';
  try {
    driver = neo4j.driver(uri, neo4j.auth.basic('neo4j', pw));
    await driver.verifyConnectivity();
    dbSession = driver.session();
    snapshotMode = false;
    $('uplink').style.display = 'none';
    $('cypher').disabled = false;
    setStatus('UPLINK: LIVE · ' + uri.replace(/^neo4j\+s?:\/\//,''));
    log('⟁ UPLINK ESTABLISHED — every node from here on is a database record', 'sys');
    const res = await runCypher("MATCH (s:Service {name:'payment-gateway'}) RETURN s");
    if (res && res.records.length === 0) {
      log('DATABASE EMPTY — load NordWind via the Session 3 notebook, then press RESET here', 'err');
    } else {
      log('SEED: payment-gateway · click it to pull its neighborhood from the DB', 'sys');
    }
    setTimeout(() => { controls.autoRotate = true; $('orbitBtn').classList.add('active'); }, 600);
  } catch (e) {
    driver = null;
    $('upmsg').style.color = '#fca5a5';
    $('upmsg').textContent = '✗ ' + (e.message||e).toString().slice(0, 90);
  }
};

/* ---------- snapshot fallback (no DB) ---------- */
const SNAP = 'https://raw.githubusercontent.com/noctetemp/nordwind-workshop/main/dataset/';
async function loadSnapshot() {
  snapshotMode = true;
  $('uplink').style.display = 'none';
  $('cypher').disabled = true;
  setStatus('UPLINK: SNAPSHOT (static file — connect a DB for live navigation)');
  const jf = p => fetch(SNAP + p).then(r => r.json());
  const [teams, engineers, services, incidents, rels] = await Promise.all([
    jf('entities/teams.json'), jf('entities/engineers.json'), jf('entities/services.json'),
    jf('entities/incidents.json'), jf('relationships.json')]);
  const put = (id, group, name, sub, val) => {
    if (nodesById.has(id)) return;
    const n = { id, group, name, sub, val }; nodesById.set(id, n); gData.nodes.push(n); };
  teams.forEach(t => put(t.name, 'Team', t.name, t.focus, 14));
  engineers.forEach(e => put(e.name, 'Engineer', e.name, e.role, 4));
  services.forEach(s => put(s.name, 'Service', s.name, s.description, 8));
  incidents.forEach(i => put(i.id, 'Incident', i.id, `${i.severity} · ${i.title}`, 6));
  rels.forEach((r, k) => { const l = { id:'s'+k, source:r.from, target:r.to, type:r.type };
    linksById.set(l.id, l); gData.links.push(l); });
  refresh();
  log('📼 SNAPSHOT LOADED — 73 nodes, 153 rels from static JSON', 'sys');
  setTimeout(() => { controls.autoRotate = true; $('orbitBtn').classList.add('active'); }, 600);
}
$('offlineBtn').onclick = loadSnapshot;
$('snapBtn').onclick = loadSnapshot;

/* ---------- buttons ---------- */
$('uplinkBtn').onclick = () => { $('uplink').style.display = 'block'; };
$('loadAllBtn').onclick = () => runCypher(
  'MATCH (n) OPTIONAL MATCH (n)-[r]->() RETURN n, r LIMIT 1000');
$('traceBtn').onclick = async function () {
  if (snapshotMode) {  // offline trace over in-memory graph
    const dep = new Set([...linksById.values()].filter(l=>l.type==='DEPENDS_ON' &&
        (l.target.id||l.target)==='payment-gateway').map(l=>l.source.id||l.source));
    const inc = new Set([...linksById.values()].filter(l=>l.type==='AFFECTED' &&
        dep.has(l.target.id||l.target)).map(l=>l.source.id||l.source));
    const eng = new Set([...linksById.values()].filter(l=>l.type==='RESPONDED_TO' &&
        inc.has(l.target.id||l.target)).map(l=>l.source.id||l.source));
    hl.nodes = new Set([...eng, ...inc, ...dep, 'payment-gateway']);
    hl.links = new Set([...linksById.values()].filter(l => {
      const s=l.source.id||l.source, t=l.target.id||l.target;
      return (l.type==='RESPONDED_TO'&&eng.has(s)&&inc.has(t)) ||
             (l.type==='AFFECTED'&&inc.has(s)&&dep.has(t)) ||
             (l.type==='DEPENDS_ON'&&dep.has(s)&&t==='payment-gateway'); }).map(l=>l.id));
    hl.on = true; refresh();
    log(`⚡ TRACE (offline): ${eng.size} engineers · ${inc.size} incidents`, 'sys');
  } else {
    log('> TRACE: MATCH p=(:Engineer)-[:RESPONDED_TO]->(:Incident)-[:AFFECTED]->(:Service)-[:DEPENDS_ON]->({name:"payment-gateway"}) RETURN p', 'sys');
    await runCypher(
      "MATCH p=(e:Engineer)-[:RESPONDED_TO]->(i:Incident)-[:AFFECTED]->(d:Service)-[:DEPENDS_ON]->(:Service {name:'payment-gateway'}) RETURN p",
      {}, true);
  }
  this.classList.add('active');
};
$('clearHlBtn').onclick = () => { hl.on = false; hl.nodes.clear(); hl.links.clear();
  $('traceBtn').classList.remove('active'); refresh(); };
$('resetBtn').onclick = async () => {
  nodesById.clear(); linksById.clear(); gData.nodes = []; gData.links = [];
  hl.on = false; hl.nodes.clear(); hl.links.clear(); refresh();
  if (driver && !snapshotMode) await runCypher("MATCH (s:Service {name:'payment-gateway'}) RETURN s");
  log('⟲ SCENE CLEARED', 'sys');
};
$('orbitBtn').onclick = function () {
  controls.autoRotate = !controls.autoRotate;
  this.classList.toggle('active', controls.autoRotate);
};

/* ---------- cypher console ---------- */
const HISTORY = []; let hIdx = -1;
$('cypher').addEventListener('keydown', async e => {
  if (e.key === 'Enter') {
    const q = $('cypher').value.trim();
    if (!q) return;
    HISTORY.push(q); hIdx = HISTORY.length;
    log('> ' + q.slice(0, 100), 'sys');
    $('cypher').value = '';
    await runCypher(q, {}, /RETURN\s+p\b|\bpath\b/i.test(q));
  } else if (e.key === 'ArrowUp' && hIdx > 0) { $('cypher').value = HISTORY[--hIdx]; }
  else if (e.key === 'ArrowDown' && hIdx < HISTORY.length-1) { $('cypher').value = HISTORY[++hIdx]; }
});

log('⟁ NORDWIND GRAPH NAVIGATOR READY — establish uplink to begin', 'sys');
Graph.cameraPosition({ x: 0, y: 0, z: 380 });
</script>
</body>
</html>
